<script>
(function() {
  function showError(msg, src, line, col, err) {
    document.getElementById('loading-indicator').style.display = 'none';
    var ov = document.getElementById('error-overlay');
    var txt = document.getElementById('error-text');
    ov.style.display = 'block';
    var detail = err ? (err.stack || err.toString()) : msg;
    txt.textContent = 'Message: ' + msg + '\nSource:  ' + src + '\nLine:    ' + line + ', Col: ' + col + '\n\nStack trace:\n' + detail;
  }
  window.onerror = function(msg, src, line, col, err) { showError(msg, src, line, col, err); return false; };
  window.addEventListener('unhandledrejection', function(e) {
    showError(String(e.reason), 'Promise rejection', 0, 0, e.reason);
  });
  // Hide loading indicator once React mounts something into #root
  var observer = new MutationObserver(function(mutations) {
    var root = document.getElementById('root');
    if (root && root.children.length > 0) {
      document.getElementById('loading-indicator').style.display = 'none';
      observer.disconnect();
    }
  });
  document.addEventListener('DOMContentLoaded', function() {
    var root = document.getElementById('root');
    if (root) observer.observe(root, {childList:true, subtree:false});
    // If still loading after 30s, show a timeout message
    setTimeout(function() {
      var li = document.getElementById('loading-indicator');
      if (li && li.style.display !== 'none') {

      }
    }, 30000);
  });
})();
</script>

const agentEngine = (lot, last, settings) => {
  const s = settings || DEFAULT_SETTINGS;
  const items = [];
  if (!last) return [{level:"ok",color:"#22c55e",icon:"✓",title:"No readings yet",msg:"Log a reading to enable agent analysis."}];

  const pH = last.ph, so2 = last.so2Free, malic = last.malic, ta = last.ta;
  const isNewOak = lot.vessel?.fill==="new" || lot.vessel?.fill==="1st fill" || (lot.oak||"").toLowerCase().includes("new");
  const inMLF = malic != null && malic > 0.3;
  const mlfDone = malic != null && malic <= 0.1;

  // Molecular SO2 check
  if (so2 != null && pH != null) {
    const mSO2 = so2 / (1 + Math.pow(10, pH - 1.81));
    const freeSO2Target = s.targetMolecularSO2 * (1 + Math.pow(10, pH - 1.81)) + (isNewOak ? s.newOakSO2Buffer : 0);
    if (so2 < freeSO2Target * 0.6) {
      items.push({level:"critical",color:C.red,bg:C.redDim,icon:"🚨",title:"Critical — Low Free SO₂",
        msg:`${so2} ppm at pH ${pH} = ${mSO2.toFixed(2)} ppm molecular (target ≥${freeSO2Target.toFixed(0)} ppm free). Add SO₂ before next racking.`});
    } else if (so2 < freeSO2Target) {
      items.push({level:"warn",color:C.yellow,bg:C.yellowDim,icon:"⚠️",title:"Free SO₂ Below Target",
        msg:`${so2} ppm at pH ${pH} = ${mSO2.toFixed(2)} ppm molecular. Target ${freeSO2Target.toFixed(0)} ppm free. Schedule SO₂ check soon.`});
    }
  }

  // VA risk
  if (lot.health.includes("va_risk") || (pH != null && pH > s.vaRiskPHThreshold && so2 != null && so2 < 16)) {
    items.push({level:"critical",color:C.red,bg:C.redDim,icon:"🦠",title:"VA Risk",
      msg:`pH ${pH??'—'}, free SO₂ ${so2??'—'} ppm. High pH + low SO₂ creates conditions for acetic acid bacteria. Rack now, add SO₂, monitor weekly.`});
  }

  // High pH
  if (pH != null && pH > 3.65 && !items.find(i=>i.title==="VA Risk")) {
    items.push({level:"warn",color:C.orange,bg:C.orangeDim,icon:"⚗️",title:"High pH",
      msg:`pH ${pH}: molecular SO₂ efficiency is reduced and microbial risk increases. Consider tartaric acid addition (bench trial first).`});
  }

  // Reduction
  if (lot.health.includes("reductive")) {
    const hasCu = lot.additions?.some(a=>(a.type||"").toLowerCase().includes("copper"));
    items.push({level:"warn",color:C.blue,bg:C.blueDim,icon:"💧",title:"Reduction Detected",
      msg: hasCu
        ? "Copper treatment logged — allow 2 weeks and recheck. Consider micro-oxygenation at next racking."
        : "Rack with splash, consider 0.1–0.2 mg/L copper sulfate addition, or micro-oxygenation. Avoid reductive conditions until resolved."});
  }

  // MLF stalled
  if (inMLF && lot.health.includes("mlf_slow")) {
    items.push({level:"warn",color:C.accentLight,bg:C.accentDim,icon:"🔬",title:"MLF Stalled",
      msg:`Malic at ${malic} g/L — not progressing. Check: cellar temp (needs >60°F / 16°C), SO₂ levels, bacterial nutrition. Consider Enoferm Alpha re-inoculation.`});
  }

  // SO2 inhibiting MLF
  if (inMLF && so2 != null && so2 > 20) {
    items.push({level:"warn",color:C.yellow,bg:C.yellowDim,icon:"⚠️",title:"SO₂ May Be Inhibiting MLF",
      msg:`Free SO₂ at ${so2} ppm during active MLF (malic ${malic} g/L). High SO₂ stalls malolactic bacteria. Do not add SO₂ until MLF is complete.`});
  }

  // MLF complete — SO2 needed
  if (mlfDone && so2 != null && so2 < 20) {
    items.push({level:"warn",color:C.yellow,bg:C.yellowDim,icon:"🧪",title:"MLF Complete — Add SO₂",
      msg:`Malic at ${malic} g/L (MLF complete). Free SO₂ at ${so2} ppm is below post-MLF target. Rack and add SO₂ now to protect the wine.`});
  }

  // New oak SO2 note
  if (isNewOak && so2 != null && so2 > 0) {
    items.push({level:"info",color:C.teal,bg:C.tealDim,icon:"🛢",title:"New Oak — SO₂ Binding",
      msg:`New oak barrels absorb 10–20 ppm free SO₂ extra. Recheck free SO₂ within 2 weeks of any addition. Buffer of +${s.newOakSO2Buffer} ppm is applied to your SO₂ target.`});
  }

  // Low TA
  if (ta != null && ta < 4.8) {
    items.push({level:"info",color:C.teal,bg:C.tealDim,icon:"⚗️",title:"Low TA",
      msg:`TA at ${ta} g/L is below typical red wine range (5.5–7.0 g/L). Consider tartaric acid addition to improve structure and lower pH.`});
  }

  // Suggest malic check if wine is aging but malic never tested
  const hasMalicLog = lot.logs.some(l => l.malic != null);
  if (!hasMalicLog && (lot.status === "aging" || lot.status === "active")) {
    items.push({level:"info", color:C.accentLight, bg:C.accentDim, icon:"🔬", title:"Malic Check Needed",
      msg:"No malic acid reading on record. Test to confirm MLF status before next SO₂ addition."});
  }

  // Warn if SO₂ was added but MLF might not be complete
  const recentSO2Addition = lot.additions?.some(a => a.type?.includes("SO") && a.date >= addDays(today(),-30));
  if (recentSO2Addition && malic != null && malic > 0.1) {
    items.push({level:"warn", color:C.red, bg:C.redDim, icon:"⚠", title:"SO₂ Added During Active MLF",
      msg:`Malic at ${malic} g/L suggests MLF is still active. SO₂ additions can kill MLB and stall MLF permanently. Verify MLF status before any sulfur additions.`});
  }


  if (items.length === 0) {
    items.push({level:"ok",color:C.green,bg:C.greenDim,icon:"✓",title:"All Clear",msg:"No issues flagged based on current readings and health flags."});
  }

  // Sort: critical first, then warn, then info, then ok
  const priority = {critical:0,warn:1,info:2,ok:3};
  return items.sort((a,b)=>priority[a.level]-priority[b.level]);
};


const blockRecommendations = (block) => {
  const recs = [];
  
  if (block.avgPH && block.avgPH >= 3.6) {
    recs.push({
      level: "warn",
      icon: "🌿",
      title: "High Fruit pH",
      msg: `Avg pH ${block.avgPH} — Consider: canopy management, earlier pick date, cover crop to compete for K, soil amendment (gypsum). Target harvest pH < 3.5 for PN.`
    });
  }
  if (block.avgK && block.avgK > 2000) {
    recs.push({
      level: "warn",
      icon: "⚡",
      title: "Elevated Potassium",
      msg: `K ${block.avgK} mg/L — High K drives high pH. Consider: reduce N/K fertilization, gypsum soil amendment, remove petioles early, open canopy. Avoid over-irrigation.`
    });
  }
  if (block.avgYAN && block.avgYAN < 150) {
    recs.push({
      level: "warn",
      icon: "🧬",
      title: "Low Nitrogen (YAN)",
      msg: `Avg YAN ${block.avgYAN} mg/L — Risk of stuck fermentation. In-vineyard: foliar urea spray (10 lbs/acre at veraison). In-cellar: plan DAP/Fermaid additions at inoculation.`
    });
  }
  if (block.avgYAN && block.avgYAN > 350) {
    recs.push({
      level: "info",
      icon: "🌱",
      title: "High YAN",
      msg: `Avg YAN ${block.avgYAN} mg/L — Risk of excess H₂S / reductive fault. Consider: cover crops, reduce N inputs, leaf removal for airflow.`
    });
  }
  if (recs.length === 0) {
    recs.push({ level:"ok", icon:"✅", title:"Looking Good", msg:"No issues flagged based on available block data. Keep logging harvest data." });
  }
  return recs;
};

  const [showAdd, setShowAdd] = React.useState(false);
  const [form, setForm] = React.useState({date: new Date().toISOString().slice(0,10), brix:'', temp:'', notes:''});

  React.useEffect(() => {
    try { localStorage.setItem('cm_ferm_readings', JSON.stringify(readings)); } catch(e) {}
  }, [readings]);

  const lotReadings = selLotId ? (readings[selLotId] || []).slice().sort((a,b) => a.date.localeCompare(b.date)) : [];
  const selLot = lots ? lots.find(l => String(l.id) === selLotId) : null;

  const addReading = () => {
    if (!selLotId || (!form.brix && !form.temp)) return;
    const r = {date: form.date, brix: form.brix ? Number(form.brix) : null, temp: form.temp ? Number(form.temp) : null, notes: form.notes.trim(), id: Date.now()};
    setReadings(prev => ({...prev, [selLotId]: [...(prev[selLotId]||[]), r]}));

  const renderChart = (data, key, color, unit, label) => {
    const vals = data.map(r => r[key]).filter(v => v !== null && v !== undefined);
    if (vals.length < 2) return null;
    const min = Math.min(...vals), max = Math.max(...vals);
    const range = max - min || 1;
    const W = 320, H = 100, PAD = 8;
    const pts = data.filter(r => r[key] !== null && r[key] !== undefined).map((r, i, arr) => {
      const x = PAD + (i / Math.max(arr.length-1, 1)) * (W - PAD*2);
      const y = PAD + (1 - (r[key] - min) / range) * (H - PAD*2);

const QRScanScreen = ({lots}) => {
  const [scanning, setScanning] = React.useState(false);
  const [result, setResult]     = React.useState(null);
  const [error, setError]       = React.useState('');
  const [manualId, setManualId] = React.useState('');
  const [lotInfo, setLotInfo]   = React.useState(null);
  const videoRef  = React.useRef(null);
  const streamRef = React.useRef(null);
  const intervalRef = React.useRef(null);

  const stopScan = () => {
    if (streamRef.current) { streamRef.current.getTracks().forEach(t=>t.stop()); streamRef.current=null; }
    if (intervalRef.current) { clearInterval(intervalRef.current); intervalRef.current=null; }
    setScanning(false);
  };

  React.useEffect(() => () => stopScan(), []);

  const startScan = async () => {
    setError(''); setResult(null); setLotInfo(null);
    try {
      const stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
      streamRef.current = stream;
      setScanning(true);
      setTimeout(() => {
        if (videoRef.current) { videoRef.current.srcObject = stream; videoRef.current.play(); }
      }, 100);
      // Poll for QR via BarcodeDetector if available
      if ('BarcodeDetector' in window) {
        const bd = new BarcodeDetector({formats:['qr_code','code_128','code_39','ean_13']});
        intervalRef.current = setInterval(async () => {
          if (!videoRef.current) return;
          try {
            const codes = await bd.detect(videoRef.current);
            if (codes.length > 0) {
              const val = codes[0].rawValue;
              stopScan();
              setResult(val);
              lookupLot(val);
            }
          } catch(e) {}
        }, 500);
      } else {
        setError('BarcodeDetector not supported in this browser. Use manual entry below.');
      }
    } catch(e) {
      setError('Camera access denied or unavailable: ' + e.message);
      setScanning(false);
    }
  };

  const lookupLot = (val) => {
    if (!lots) return;
    const found = lots.find(l =>
      l.id === val || l.id === Number(val) ||
      (l.barrel && String(l.barrel) === val) ||
      (l.name && l.name.toLowerCase() === val.toLowerCase()) ||
      String(l.id).includes(val) || (l.barrel && String(l.barrel).includes(val))
    );
    setLotInfo(found || null);
    if (!found) setError('No lot matched "' + val + '". Try manual lookup below.');
    else setError('');
  };

  const handleManual = () => { if(manualId.trim()){ setResult(manualId.trim()); lookupLot(manualId.trim()); } };

  const statusColors = {active:C.green, filtered:C.teal, bottled:C.blue, sold:C.textDim};

  return React.createElement(React.Fragment, null,
    React.createElement('div', {style:{fontSize:13,color:C.textDim,marginBottom:16}},

    ),
    // Camera panel
    React.createElement('div', {style:{background:C.card,border:'1px solid '+C.cardBorder,borderRadius:12,padding:16,marginBottom:16}},
      React.createElement('div', {style:{display:'flex',gap:8,marginBottom:12,alignItems:'center'}},
        React.createElement('button', {
          onClick: scanning ? stopScan : startScan,
          style:{background:scanning?C.red:C.accent,border:'none',borderRadius:8,padding:'8px 18px',
                 color:'#fff',fontSize:13,fontWeight:700,cursor:'pointer'}
        }, scanning ? '⏹ Stop Scanning' : '📷 Start Camera Scan'),
        scanning && React.createElement('div', {style:{fontSize:12,color:C.yellow,animation:'pulse 1s infinite'}}, '● Scanning...')
      ),
      scanning && React.createElement('div', {style:{position:'relative',borderRadius:10,overflow:'hidden',background:'#000',maxWidth:400}},
        React.createElement('video', {ref:videoRef, autoPlay:true, playsInline:true,
          style:{width:'100%',display:'block',borderRadius:10}}),
        React.createElement('div', {style:{position:'absolute',top:'50%',left:'50%',transform:'translate(-50%,-50%)',
          width:180,height:180,border:'2px solid '+C.accent,borderRadius:12,
          boxShadow:'0 0 0 9999px rgba(0,0,0,0.4)',pointerEvents:'none'}})
      ),
      error && React.createElement('div', {style:{color:C.yellow,fontSize:12,marginTop:8}}, '⚠ ' + error)
    ),

      React.createElement('div', {style:{fontSize:12,fontWeight:700,color:C.textDim,letterSpacing:0.8,textTransform:'uppercase',marginBottom:10}}, 'Manual Lookup'),
      React.createElement('div', {style:{display:'flex',gap:8}},

// ── Cellar Health Dashboard ────────────────────────────────────────────────────
const CellarHealthScreen = ({lots, settings, go, SCREENS}) => {
  const s = settings || DEFAULT_SETTINGS;
  const [tab, setTab] = React.useState('health');
  const activeLots = lots.filter(l => l.status==='aging'||l.status==='barrel'||l.status==='active'||(l.status==='done'&&l.logs&&l.logs.length>0));

  // ── Tab 1: SO2 Health data ──
  const healthData = activeLots.map(lot => {
    const logs = lot.logs || [];
    const last = logs.length > 0 ? logs[logs.length - 1] : null;
    const ph = last ? (last.ph||null) : null;
    const so2 = last ? (last.so2Free||null) : null;
    const daysSince = last ? Math.floor((Date.now() - new Date(last.date)) / 86400000) : null;
    const isNewOak = (lot.vessel&&lot.vessel.fill==='new')||(lot.vessel&&lot.vessel.fill==='1st fill')||((lot.oak||'').toLowerCase().includes('new'));
    let status='nodata', statusColor=C.textDim, statusBg=C.card, statusIcon='-', freeSO2Target=null, mSO2=null;
    if (so2!=null && ph!=null) {
      mSO2 = so2 / (1 + Math.pow(10, ph - 1.81));
      freeSO2Target = s.targetMolecularSO2 * (1 + Math.pow(10, ph - 1.81)) + (isNewOak ? s.newOakSO2Buffer : 0);
      if (so2 < freeSO2Target * 0.6) { status='critical'; statusColor=C.red; statusBg=C.redDim; statusIcon='!!'; }
      else if (so2 < freeSO2Target) { status='warn'; statusColor=C.yellow; statusBg=C.yellowDim; statusIcon='!'; }
      else { status='ok'; statusColor=C.green; statusBg=C.greenDim; statusIcon='OK'; }
    } else if (last) { status='partial'; statusColor=C.yellow; statusBg=C.yellowDim; statusIcon='?'; }
    return {lot, last, ph, so2, daysSince, status, statusColor, statusBg, statusIcon, freeSO2Target, mSO2};
  });
  const ord = {critical:0, warn:1, partial:2, ok:3, nodata:4};
  healthData.sort((a,b) => (ord[a.status]||0) - (ord[b.status]||0));
  const hcnt = {critical:0, warn:0, ok:0, nodata:0};
  healthData.forEach(h => {
    if (h.status==='critical') hcnt.critical++;
    else if (h.status==='warn'||h.status==='partial') hcnt.warn++;
    else if (h.status==='ok') hcnt.ok++;
    else hcnt.nodata++;
  });

  // ── Tab 2: Next Actions data ──
  const addSO2=[], inMLF=[], needTest=[], ownerCall=[], highPH=[];
  activeLots.forEach(lot => {
    const logs = lot.logs || [];
    const last = logs.length > 0 ? logs[logs.length - 1] : null;
    const ph = last ? (last.ph||null) : null;
    const malic = last ? (last.malic||null) : null;
    const so2 = last ? (last.so2Free||null) : null;
    const isNewOak = (lot.vessel&&lot.vessel.fill==='new')||(lot.vessel&&lot.vessel.fill==='1st fill')||((lot.oak||'').toLowerCase().includes('new'));
    let freeSO2Target = null;
    if (ph!=null) freeSO2Target = s.targetMolecularSO2 * (1 + Math.pow(10, ph - 1.81)) + (isNewOak ? s.newOakSO2Buffer : 0);
    const notes = (last && last.notes) || '';
    const isOwner = notes.toLowerCase().indexOf('owner call') !== -1;
    const item = {lot, ph, malic, so2, freeSO2Target, notes};
    if (isOwner) { ownerCall.push(item); }
    else if (lot.mlfComplete === null) { needTest.push(item); }
    else if (lot.mlfComplete === false) { inMLF.push(item); }
    else if (lot.mlfComplete === true) {
      if (so2===null || (freeSO2Target!==null && so2 < freeSO2Target)) addSO2.push(item);
      if (ph!==null && ph > 3.84) highPH.push(item);
    }
  });
  const sbn = (a,b) => a.lot.name < b.lot.name ? -1 : 1;
  addSO2.sort(sbn); inMLF.sort(sbn); needTest.sort(sbn); highPH.sort(sbn); ownerCall.sort(sbn);

      React.createElement('div', {style:{fontSize:9,color:numColor,fontWeight:700,marginTop:2}}, lbl)

    React.createElement('button', {onClick:function(){setTab(id);},
      style:{flex:1,padding:'8px 0',background:tab===id?C.accent:C.card,

  const renderActionCard = (item) =>
    React.createElement('div', {key:item.lot.id,
      style:{background:C.card,border:'1px solid '+C.cardBorder,borderRadius:10,padding:'10px 14px',marginBottom:7}},
      React.createElement('div', {style:{display:'flex',justifyContent:'space-between',alignItems:'center'}},
        React.createElement('div', null,
          React.createElement('div', {style:{fontWeight:700,fontSize:13,color:C.text}}, item.lot.name),
          React.createElement('div', {style:{fontSize:11,color:C.textDim}},
            (item.lot.varietal||'')+(item.ph!==null?' | pH '+item.ph:'')+(item.malic!==null?' | Malic '+item.malic:''))
        ),
        React.createElement('button', {onClick:function(){go(SCREENS.log, SCREENS.health);},
          style:{background:C.accent,border:'none',borderRadius:7,padding:'4px 10px',color:'#fff',fontSize:11,fontWeight:700,cursor:'pointer'}}, 'Log')
      ),
      item.freeSO2Target!==null && React.createElement('div', {style:{fontSize:11,color:C.textDim,marginTop:4}},
        'Target: '+item.freeSO2Target.toFixed(0)+' ppm free')
    );

  const renderActionSection = (title, color, bg, border, items) => {
    if (items.length===0) return null;
    return React.createElement('div', {style:{marginBottom:16}},
      React.createElement('div', {style:{display:'flex',alignItems:'center',gap:8,marginBottom:8}},
        React.createElement('div', {style:{background:bg,border:'1px solid '+border,borderRadius:6,padding:'3px 8px',fontSize:11,fontWeight:800,color:color}}, title),
        React.createElement('div', {style:{fontSize:12,color:C.textDim,fontWeight:600}}, items.length+' lots')
      ),
      ...items.map(renderActionCard)
    );
  };

  const totalActions = addSO2.length + inMLF.length + needTest.length;

  return React.createElement(React.Fragment, null,
    // Tab switcher
    React.createElement('div', {style:{display:'flex',gap:6,marginBottom:14}},
      TabBtn('health', 'SO2 HEALTH', 0),
      TabBtn('actions', 'NEXT ACTIONS', totalActions)
    ),

    // ── Tab 1: Health ──
    tab==='health' && React.createElement(React.Fragment, null,
      React.createElement('div', {style:{display:'flex',gap:8,marginBottom:16}},
        StatPill(C.redDim, C.red, C.red, hcnt.critical, 'CRITICAL'),
        StatPill(C.yellowDim, C.yellow, C.yellow, hcnt.warn, 'WARN'),
        StatPill(C.greenDim, C.green, C.green, hcnt.ok, 'OK'),

async function getSupaProfile(userId) {
