<script>
(function() {
  function showError(msg, src, line, col, err) {
    document.getElementById('loading-indicator').style.display = 'none';
    var ov = document.getElementById('error-overlay');
    var txt = document.getElementById('error-text');
    ov.style.display = 'block';
    var detail = err ? (err.stack || err.toString()) : msg;
    txt.textContent = 'Message: ' + msg + '\nSource:  ' + src + '\nLine:    ' + line + ', Col: ' + col + '\n\nStack trace:\n' + detail;
  }
  window.onerror = function(msg, src, line, col, err) { showError(msg, src, line, col, err); return false; };
  window.addEventListener('unhandledrejection', function(e) {
    showError(String(e.reason), 'Promise rejection', 0, 0, e.reason);
  });
  // Hide loading indicator once React mounts something into #root
  var observer = new MutationObserver(function(mutations) {
    var root = document.getElementById('root');
    if (root && root.children.length > 0) {
      document.getElementById('loading-indicator').style.display = 'none';
      observer.disconnect();
    }
  });
  document.addEventListener('DOMContentLoaded', function() {
    var root = document.getElementById('root');
    if (root) observer.observe(root, {childList:true, subtree:false});
    // If still loading after 30s, show a timeout message
    setTimeout(function() {
      var li = document.getElementById('loading-indicator');
      if (li && li.style.display !== 'none') {

      }
    }, 30000);
  });
})();

const agentEngine = (lot, last, settings) => {
  const s = settings || DEFAULT_SETTINGS;
  const items = [];
  if (!last) return [{level:"ok",color:"#22c55e",icon:"✓",title:"No readings yet",msg:"Log a reading to enable agent analysis."}];

  const pH = last.ph, so2 = last.so2Free, malic = last.malic, ta = last.ta;
  const isNewOak = lot.vessel?.fill==="new" || lot.vessel?.fill==="1st fill" || (lot.oak||"").toLowerCase().includes("new");
  const inMLF = malic != null && malic > 0.3;
  const mlfDone = malic != null && malic <= 0.1;

  // Molecular SO2 check
  if (so2 != null && pH != null) {
    const mSO2 = so2 / (1 + Math.pow(10, pH - 1.81));
    const freeSO2Target = s.targetMolecularSO2 * (1 + Math.pow(10, pH - 1.81)) + (isNewOak ? s.newOakSO2Buffer : 0);
    if (so2 < freeSO2Target * 0.6) {
      items.push({level:"critical",color:C.red,bg:C.redDim,icon:"🚨",title:"Critical — Low Free SO₂",
        msg:`${so2} ppm at pH ${pH} = ${mSO2.toFixed(2)} ppm molecular (target ≥${freeSO2Target.toFixed(0)} ppm free). Add SO₂ before next racking.`});
    } else if (so2 < freeSO2Target) {
      items.push({level:"warn",color:C.yellow,bg:C.yellowDim,icon:"⚠️",title:"Free SO₂ Below Target",
        msg:`${so2} ppm at pH ${pH} = ${mSO2.toFixed(2)} ppm molecular. Target ${freeSO2Target.toFixed(0)} ppm free. Schedule SO₂ check soon.`});
    }
  }

  // VA risk
  if (lot.health.includes("va_risk") || (pH != null && pH > s.vaRiskPHThreshold && so2 != null && so2 < 16)) {
    items.push({level:"critical",color:C.red,bg:C.redDim,icon:"🦠",title:"VA Risk",
      msg:`pH ${pH??'—'}, free SO₂ ${so2??'—'} ppm. High pH + low SO₂ creates conditions for acetic acid bacteria. Rack now, add SO₂, monitor weekly.`});
  }

  // High pH
  if (pH != null && pH > 3.65 && !items.find(i=>i.title==="VA Risk")) {
    items.push({level:"warn",color:C.orange,bg:C.orangeDim,icon:"⚗️",title:"High pH",
      msg:`pH ${pH}: molecular SO₂ efficiency is reduced and microbial risk increases. Consider tartaric acid addition (bench trial first).`});
  }

  // Reduction
  if (lot.health.includes("reductive")) {
    const hasCu = lot.additions?.some(a=>(a.type||"").toLowerCase().includes("copper"));
    items.push({level:"warn",color:C.blue,bg:C.blueDim,icon:"💧",title:"Reduction Detected",
      msg: hasCu
        ? "Copper treatment logged — allow 2 weeks and recheck. Consider micro-oxygenation at next racking."
        : "Rack with splash, consider 0.1–0.2 mg/L copper sulfate addition, or micro-oxygenation. Avoid reductive conditions until resolved."});
  }

  // MLF stalled
  if (inMLF && lot.health.includes("mlf_slow")) {
    items.push({level:"warn",color:C.accentLight,bg:C.accentDim,icon:"🔬",title:"MLF Stalled",
      msg:`Malic at ${malic} g/L — not progressing. Check: cellar temp (needs >60°F / 16°C), SO₂ levels, bacterial nutrition. Consider Enoferm Alpha re-inoculation.`});
  }

  // SO2 inhibiting MLF
  if (inMLF && so2 != null && so2 > 20) {
    items.push({level:"warn",color:C.yellow,bg:C.yellowDim,icon:"⚠️",title:"SO₂ May Be Inhibiting MLF",
      msg:`Free SO₂ at ${so2} ppm during active MLF (malic ${malic} g/L). High SO₂ stalls malolactic bacteria. Do not add SO₂ until MLF is complete.`});
  }

  // MLF complete — SO2 needed
  if (mlfDone && so2 != null && so2 < 20) {
    items.push({level:"warn",color:C.yellow,bg:C.yellowDim,icon:"🧪",title:"MLF Complete — Add SO₂",
      msg:`Malic at ${malic} g/L (MLF complete). Free SO₂ at ${so2} ppm is below post-MLF target. Rack and add SO₂ now to protect the wine.`});
  }

  // New oak SO2 note
  if (isNewOak && so2 != null && so2 > 0) {
    items.push({level:"info",color:C.teal,bg:C.tealDim,icon:"🛢",title:"New Oak — SO₂ Binding",
      msg:`New oak barrels absorb 10–20 ppm free SO₂ extra. Recheck free SO₂ within 2 weeks of any addition. Buffer of +${s.newOakSO2Buffer} ppm is applied to your SO₂ target.`});
  }

  // Low TA
  if (ta != null && ta < 4.8) {
    items.push({level:"info",color:C.teal,bg:C.tealDim,icon:"⚗️",title:"Low TA",
      msg:`TA at ${ta} g/L is below typical red wine range (5.5–7.0 g/L). Consider tartaric acid addition to improve structure and lower pH.`});
  }

  // Suggest malic check if wine is aging but malic never tested
  const hasMalicLog = lot.logs.some(l => l.malic != null);
  if (!hasMalicLog && (lot.status === "aging" || lot.status === "active")) {
    items.push({level:"info", color:C.accentLight, bg:C.accentDim, icon:"🔬", title:"Malic Check Needed",
      msg:"No malic acid reading on record. Test to confirm MLF status before next SO₂ addition."});
  }

  // Warn if SO₂ was added but MLF might not be complete
  const recentSO2Addition = lot.additions?.some(a => a.type?.includes("SO") && a.date >= addDays(today(),-30));
  if (recentSO2Addition && malic != null && malic > 0.1) {
    items.push({level:"warn", color:C.red, bg:C.redDim, icon:"⚠", title:"SO₂ Added During Active MLF",
      msg:`Malic at ${malic} g/L suggests MLF is still active. SO₂ additions can kill MLB and stall MLF permanently. Verify MLF status before any sulfur additions.`});
  }


  if (items.length === 0) {
    items.push({level:"ok",color:C.green,bg:C.greenDim,icon:"✓",title:"All Clear",msg:"No issues flagged based on current readings and health flags."});
  }

  // Sort: critical first, then warn, then info, then ok
  const priority = {critical:0,warn:1,info:2,ok:3};
  return items.sort((a,b)=>priority[a.level]-priority[b.level]);
};


const blockRecommendations = (block) => {
  const recs = [];

      title: "High Fruit pH",

    });
  }

      msg: `K ${block.avgK} mg/L — High K drives high pH. Consider: reduce N/K fertilization, gypsum soil amendment, remove petioles early, open canopy. Avoid over-irrigation.`
    });
  }
  if (block.avgYAN && block.avgYAN < 150) {
    recs.push({
      level: "warn",
      icon: "🧬",
      title: "Low Nitrogen (YAN)",
      msg: `Avg YAN ${block.avgYAN} mg/L — Risk of stuck fermentation. In-vineyard: foliar urea spray (10 lbs/acre at veraison). In-cellar: plan DAP/Fermaid additions at inoculation.`
    });
  }
  if (block.avgYAN && block.avgYAN > 350) {
    recs.push({
      level: "info",
      icon: "🌱",
      title: "High YAN",
      msg: `Avg YAN ${block.avgYAN} mg/L — Risk of excess H₂S / reductive fault. Consider: cover crops, reduce N inputs, leaf removal for airflow.`
    });
  }
  if (recs.length === 0) {
    recs.push({ level:"ok", icon:"✅", title:"Looking Good", msg:"No issues flagged based on available block data. Keep logging harvest data." });
  }
  return recs;
};
